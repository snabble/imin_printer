pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file('local.properties').withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty('flutter.sdk')
        assert flutterSdkPath != null, 'flutter.sdk not set in local.properties'
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild(file("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle").toPath().toRealPath().toAbsolutePath().toString())

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

buildscript {
    dependencies {
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.6'
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    id 'com.android.application' version '8.9.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
    id 'com.google.firebase.firebase-perf' version '1.4.2' apply false
    id 'com.github.triplet.play' version '3.12.1' apply false
    // This is just required for the legacy app and causes
    //noinspection GradleDependency
    id 'com.google.firebase.crashlytics' version '3.0.3' apply false
    id 'com.google.devtools.ksp' version '2.1.20-1.0.32' apply false
}

include ':android'
include ':example'
project(':example').projectDir = new File(rootDir, 'example/android/app/')

rootProject.name = 'imin_printer'
